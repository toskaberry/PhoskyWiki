name: Production containers
on:
  # Routine push/PR coverage now runs in CI against the single release image.
  # Keep an explicit standalone D01 diagnostic run for operators.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:containers
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d01-container-evidence
          path: artifacts/operations/d01-containers.json
