name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    name: lint + typecheck + vitest
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://phosky:phosky@localhost:5432/phoskywiki_test
      BETTER_AUTH_SECRET: ci-better-auth-secret-0123456789abcdef0123456789abcdef
      # 契约测试（search-meili.contract.test.ts）打这个真 Meili；主缝测试用 fake 不受影响
      MEILI_MASTER_KEY: ci-meili-master-key
    services:
      postgres:
        image: postgres:18.3-alpine3.23@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7
        env:
          POSTGRES_USER: phosky
          POSTGRES_PASSWORD: phosky
          POSTGRES_DB: phoskywiki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phosky -d phoskywiki_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      meilisearch:
        image: getmeili/meilisearch:v1.15.0@sha256:1bb4bc096c7467ccb5db77bc0bc584c21623ecfc6f8f27e9802f67f809f30333
        env:
          MEILI_ENV: development
          MEILI_MASTER_KEY: ci-meili-master-key
          MEILI_MAX_INDEXING_MEMORY: 128Mb
          MEILI_MAX_INDEXING_THREADS: 1
        ports:
          - 7700:7700
        options: >-
          --health-cmd "curl -sf http://localhost:7700/health | grep -q available"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm test:ops
      - run: node --test scripts/release-gate.test.mjs scripts/release-image.test.mjs scripts/release-migrations.test.mjs scripts/release-refusal.test.mjs

  e2e:
    name: playwright + container
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://phosky:phosky@localhost:5432/phoskywiki_test
      # 一次性 CI 库用的签名密钥；种子管理员密码每次运行随机生成，不进仓库
      BETTER_AUTH_SECRET: ci-better-auth-secret-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      SEED_ADMIN_EMAIL: admin@phoskywiki.local
      E2E_MEILI_HOST: http://localhost:7700
      MEILI_HOST: http://localhost:7700
      MEILI_MASTER_KEY: ci-meili-master-key
    services:
      meilisearch:
        image: getmeili/meilisearch:v1.15.0@sha256:1bb4bc096c7467ccb5db77bc0bc584c21623ecfc6f8f27e9802f67f809f30333
        env:
          MEILI_ENV: development
          MEILI_MASTER_KEY: ci-meili-master-key
          MEILI_MAX_INDEXING_MEMORY: 128Mb
          MEILI_MAX_INDEXING_THREADS: 1
        ports:
          - 7700:7700
        options: >-
          --health-cmd "curl -fsS http://localhost:7700/health"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      postgres:
        image: postgres:18.3-alpine3.23@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7
        env:
          POSTGRES_USER: phosky
          POSTGRES_PASSWORD: phosky
          POSTGRES_DB: phoskywiki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phosky -d phoskywiki_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build once without runtime credentials
        env:
          REVISION: ${{ github.sha }}
        run: |
          docker build --build-arg "APP_REVISION=$REVISION" --tag phosky-ci:test .
          echo "TEST_APP_IMAGE=$(docker image inspect phosky-ci:test --format '{{.Id}}')" >> "$GITHUB_ENV"
      - run: pnpm test:containers
      - name: Linux ownership regression
        run: docker run --rm --user 0:0 --entrypoint node -v "$PWD:/workspace:ro" "$TEST_APP_IMAGE" /workspace/tests/fixtures/release-linux-permissions.mjs
      - run: pnpm db:migrate
      - run: echo "SEED_ADMIN_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
      - run: pnpm db:seed
      - run: pnpm test:e2e
      - name: Save tested image
        run: |
          docker save phosky-ci:test -o /tmp/application.tar
          printf '%s' "$TEST_APP_IMAGE" > /tmp/image-id.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tested-image-${{ github.run_attempt }}
          path: |
            /tmp/application.tar
            /tmp/image-id.txt
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            artifacts/operations/

  publish:
    name: release-ready
    needs: [lint-test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tested-image-${{ github.run_attempt }}
          path: /tmp/tested
      - name: Publish the tested image, without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker load -i /tmp/tested/application.tar
          IMAGE_ID=$(cat /tmp/tested/image-id.txt)
          test "$(docker image inspect phosky-ci:test --format '{{.Id}}')" = "$IMAGE_ID"
          test "$(docker image inspect "$IMAGE_ID" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$REVISION"
          REPO="ghcr.io/${REPOSITORY,,}"
          TAG="$REPO:$REVISION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker tag "$IMAGE_ID" "$TAG"
          docker push "$TAG"
          IMAGE=$(docker image inspect "$TAG" --format '{{index .RepoDigests 0}}')
          docker pull "$IMAGE"
          test "$(docker image inspect "$IMAGE" --format '{{.Id}}')" = "$IMAGE_ID"
          jq -n --arg sha "$REVISION" --arg runId "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" --arg image "$IMAGE" --arg imageId "$IMAGE_ID" '{sha:$sha,runId:$runId,attempt:$attempt,image:$image,imageId:$imageId}' > release.json
          docker logout ghcr.io
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.run_attempt }}
          path: release.json
          retention-days: 90
